<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oozy's Fortnite Porter | Download</title>
    <!-- marked.js converts GitHub Markdown release notes into HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            /* Exact theme colors from the app design */
            --bg-base: #0f0f11;
            --bg-panel: #151517;
            --bg-panel-light: #1c1c1e;
            --accent-orange: #fe8549;
            --accent-glow: rgba(254, 133, 73, 0.4);
            --accent-hover: #ff9c6b;
            --text-main: #f0f0f0;
            --text-muted: #9a9a9d;
            --border-color: #2a2a2c;
            --pill-bg: #35231c;
            --pill-text: #fe8549;
            --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* -----------------------------------------------------------
           GLOBAL STYLES & LAYOUT
           ----------------------------------------------------------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            background-image: 
                radial-gradient(circle at top right, rgba(254, 133, 73, 0.05) 0%, transparent 40%),
                radial-gradient(circle at center bottom, rgba(254, 133, 73, 0.02) 0%, transparent 30%);
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            opacity: 0;
            animation: fadeInPage 1s var(--ease-in-out) forwards;
        }

        /* -----------------------------------------------------------
           HEADER MATCHING THE APP
           ----------------------------------------------------------- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background-color: transparent;
            border: 4px solid var(--accent-orange);
            border-radius: 50%;
            border-bottom-color: transparent; 
            transform: rotate(45deg);
            box-shadow: 0 0 10px var(--accent-glow);
            animation: slowRotate 8s linear infinite;
        }

        .title h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
        .title p { font-size: 10px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

        .version-pill {
            background-color: var(--pill-bg);
            color: var(--pill-text);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(254, 133, 73, 0.2);
            transition: box-shadow 0.3s ease;
        }
        
        .version-pill:hover { box-shadow: 0 0 10px rgba(254, 133, 73, 0.3); }

        /* -----------------------------------------------------------
           MAIN RELEASE PANEL & DROPDOWN
           ----------------------------------------------------------- */
        .panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
            opacity: 0;
            transform: translateY(20px);
            animation: slideInUp 0.8s var(--ease-in-out) 0.3s forwards;
        }

        .panel-header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-panel-light);
            flex-wrap: wrap;
            gap: 15px;
        }

        .panel-header h2 {
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        /* Styling the dropdown to match the "STYLE" dropdown from your app */
        .version-selector-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .version-selector-container label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .custom-select {
            background-color: var(--bg-base);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 32px 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            /* Custom dropdown arrow */
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239a9a9d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 14px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .custom-select:hover, .custom-select:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 5px rgba(254, 133, 73, 0.2);
        }

        .custom-select option {
            background-color: var(--bg-panel);
            color: var(--text-main);
        }

        .panel-content {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* -----------------------------------------------------------
           RELEASE NOTES (MARKDOWN STYLING)
           ----------------------------------------------------------- */
        .release-notes {
            color: var(--text-main);
            font-size: 14px;
            line-height: 1.6;
            background-color: var(--bg-base);
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            height: 350px;
            overflow-y: auto;
            position: relative;
            transition: opacity 0.3s ease; /* Fade effect when switching versions */
        }
        
        .release-notes h1, .release-notes h2, .release-notes h3 {
            color: var(--accent-orange);
            margin-bottom: 10px;
            margin-top: 15px;
            font-size: 16px;
            text-shadow: 0 0 5px var(--accent-glow);
        }
        
        .release-notes h1:first-child, .release-notes h2:first-child { margin-top: 0; }
        .release-notes ul { margin-left: 20px; margin-bottom: 15px; color: var(--text-muted); }
        .release-notes li { margin-bottom: 5px; }
        .release-notes a { color: var(--accent-orange); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.2s ease; }
        .release-notes a:hover { border-color: var(--accent-orange); }
        .release-notes code { background: #000; padding: 2px 6px; border-radius: 4px; font-family: monospace; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; transition: background 0.3s ease; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        /* -----------------------------------------------------------
           DOWNLOAD BUTTON
           ----------------------------------------------------------- */
        .download-btn {
            background-color: var(--accent-orange);
            color: #000000;
            text-decoration: none;
            padding: 16px 24px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            border: none;
            cursor: pointer;
            display: block;
            width: 100%;
            position: relative;
            transition: background-color 0.2s ease, box-shadow 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 10px rgba(254, 133, 73, 0.2);
            overflow: hidden;
        }

        .download-btn::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.4) 50%, transparent 60%);
            transform: rotate(20deg);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .download-btn:not(.loading):hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }
        
        .download-btn:not(.loading):hover::after { animation: shine 1.5s infinite; opacity: 1; }
        .download-btn:not(.loading):active { transform: translateY(1px); box-shadow: 0 2px 5px var(--accent-glow); }
        
        .download-btn.loading {
            background-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }
        .download-btn.pulsing { animation: pulseBtnLoading 1.5s ease-in-out infinite; }

        /* -----------------------------------------------------------
           ANIMATIONS
           ----------------------------------------------------------- */
        @keyframes fadeInPage { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slowRotate { from { transform: rotate(45deg); } to { transform: rotate(405deg); } }
        @keyframes pulseNotesLoading { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.9; } }
        @keyframes pulseBtnLoading { 0%, 100% { background-color: var(--border-color); } 50% { background-color: #3a3a3d; } }
        @keyframes shine { from { left: -150%; } to { left: 150%; } }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            animation: pulseNotesLoading 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo-container">
                <div class="logo-icon"></div>
                <div class="title">
                    <h1>oozy's Fortnite Porter</h1>
                    <p>FORTNITE ASSET TOOL</p>
                </div>
            </div>
            <!-- Global Version Badge -->
            <div class="version-pill" id="header-version">fetching...</div>
        </div>

        <!-- Main Panel -->
        <div class="panel">
            <div class="panel-header">
                <h2>Release Notes</h2>
                
                <!-- NEW: Version Dropdown Menu -->
                <div class="version-selector-container">
                    <label for="version-select">Select Version</label>
                    <select id="version-select" class="custom-select" disabled>
                        <option value="">Loading releases...</option>
                    </select>
                </div>
            </div>
            
            <div class="panel-content">
                <!-- Release Notes Box -->
                <div class="release-notes" id="release-notes">
                    <div class="loader-container">
                        <p>Scanning GitHub for releases...</p>
                    </div>
                </div>

                <!-- Download Button -->
                <a href="#" id="download-btn" class="download-btn loading pulsing">Please wait...</a>
            </div>
        </div>
    </div>

    <!-- -----------------------------------------------------------
         JAVASCRIPT: API Fetcher & Version Manager
         ----------------------------------------------------------- -->
    <script>
        const GITHUB_USERNAME = 'oozycloud'; 
        const GITHUB_REPO = 'oozys-Fortnite-Porter';
        
        let allReleases = []; // Will store the array of all releases

        // 1. Fetch all releases on load
        async function fetchAllReleases() {
            const selectMenu = document.getElementById('version-select');
            const notes = document.getElementById('release-notes');
            const headerVer = document.getElementById('header-version');
            const btn = document.getElementById('download-btn');

            try {
                // Fetch ALL releases instead of just the latest
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/releases`);
                
                if (!response.ok) throw new Error('Could not fetch releases. Check repository details.');

                allReleases = await response.json();

                if (allReleases.length === 0) {
                    throw new Error('No releases found in this repository.');
                }

                // 2. Populate the dropdown menu
                selectMenu.innerHTML = ''; // clear loading text
                allReleases.forEach((release, index) => {
                    const option = document.createElement('option');
                    option.value = index; // Store array index as the value
                    
                    // Format the name nicely (e.g. "Release v2.1.0" or just the tag)
                    let name = release.name || release.tag_name;
                    if (release.prerelease) name += " (Pre-release)";
                    
                    option.textContent = name;
                    selectMenu.appendChild(option);
                });

                // Enable the dropdown and add an event listener for when the user changes it
                selectMenu.disabled = false;
                selectMenu.addEventListener('change', (e) => {
                    renderReleaseData(allReleases[e.target.value]);
                });

                // 3. Render the most recent release (index 0) by default
                renderReleaseData(allReleases[0]);

            } catch (error) {
                console.error("[GitHub API Error]:", error);
                headerVer.textContent = "error";
                selectMenu.innerHTML = '<option>Error loading</option>';
                notes.innerHTML = `<div style="padding: 20px; text-align: center; color: #ff5555;">
                    <p style="font-weight: bold;">Error loading releases.</p>
                    <p style="color:var(--text-muted); margin-top: 5px;">${error.message}</p>
                </div>`;
                
                btn.textContent = "View Repository on GitHub";
                btn.href = `https://github.com/${GITHUB_USERNAME}/${GITHUB_REPO}`;
                btn.className = 'download-btn'; // remove loading classes
            }
        }

        // 4. Function to update the UI based on the selected release
        function renderReleaseData(release) {
            const notes = document.getElementById('release-notes');
            const headerVer = document.getElementById('header-version');
            const btn = document.getElementById('download-btn');

            // Quick fade out effect for smooth transition
            notes.style.opacity = '0';
            btn.className = 'download-btn loading pulsing';
            btn.textContent = 'Updating...';

            setTimeout(() => {
                // Update Badge
                headerVer.textContent = release.tag_name;

                // Update Markdown Notes
                if (release.body) {
                    notes.innerHTML = marked.parse(release.body);
                } else {
                    notes.innerHTML = '<p style="padding:20px; color:var(--text-muted);">No release notes provided for this version.</p>';
                }
                
                // Fade notes back in
                notes.style.opacity = '1';

                // Find the correct .exe download asset
                if (release.assets && release.assets.length > 0) {
                    // Force find the .exe file first (handles your .Installer.v2.1.0.exe logic)
                    const exeAsset = release.assets.find(asset => asset.name.endsWith('.exe'));
                    const targetAsset = exeAsset || release.assets[0]; 

                    btn.href = targetAsset.browser_download_url;
                    btn.textContent = `Download ${targetAsset.name}`;
                    btn.className = 'download-btn'; // Removes loading states, unlocks button
                } else {
                    // Fallback if the specific tag doesn't have files uploaded yet
                    btn.href = release.html_url;
                    btn.textContent = "View Release on GitHub (No attached files)";
                    btn.className = 'download-btn loading'; // keeps it grayed out
                    btn.style.backgroundColor = "#333";
                }
            }, 300); // 300ms delay matches the CSS transition time
        }

        // Initialize when the page loads
        document.addEventListener('DOMContentLoaded', fetchAllReleases);
    </script>
</body>
</html>
