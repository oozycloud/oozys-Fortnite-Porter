<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oozy's Fortnite Porter</title>
    <!-- We use marked.js to automatically convert GitHub's Markdown release notes into HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-base: #0f0f11;
            --bg-panel: #151517;
            --bg-panel-light: #1c1c1e;
            --accent-orange: #fe8549;
            --accent-hover: #ff9c6b;
            --text-main: #f0f0f0;
            --text-muted: #9a9a9d;
            --border-color: #2a2a2c;
            --pill-bg: #35231c;
            --pill-text: #fe8549;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            /* Subtle background grid/glow to match the app's aesthetic */
            background-image: radial-gradient(circle at top right, rgba(254, 133, 73, 0.03) 0%, transparent 40%);
        }

        /* HEADER MATCHING THE APP */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background-color: transparent;
            border: 4px solid var(--accent-orange);
            border-radius: 50%;
            border-bottom-color: transparent; /* Creating that broken circle look */
            transform: rotate(45deg);
        }

        .title h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .title p {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .version-pill {
            background-color: var(--pill-bg);
            color: var(--pill-text);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(254, 133, 73, 0.2);
        }

        /* MAIN PANEL */
        .panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .panel-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-panel-light);
        }

        .panel-header h2 {
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .panel-content {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* RELEASE NOTES (MARKDOWN STYLING) */
        .release-notes {
            color: var(--text-main);
            font-size: 14px;
            line-height: 1.6;
            background-color: var(--bg-base);
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .release-notes h1, .release-notes h2, .release-notes h3 {
            color: var(--accent-orange);
            margin-bottom: 10px;
            margin-top: 15px;
            font-size: 16px;
        }
        
        .release-notes h1:first-child, .release-notes h2:first-child { margin-top: 0; }
        .release-notes ul { margin-left: 20px; margin-bottom: 15px; color: var(--text-muted); }
        .release-notes li { margin-bottom: 5px; }
        .release-notes a { color: var(--accent-orange); text-decoration: none; }
        .release-notes a:hover { text-decoration: underline; }
        .release-notes code { background: #000; padding: 2px 6px; border-radius: 4px; font-family: monospace; }

        /* SCROLLBAR STYLING */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        /* DOWNLOAD BUTTON MATCHING "SCAN FORTNITE FILES" */
        .download-btn {
            background-color: var(--accent-orange);
            color: #000000;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            transition: background-color 0.2s ease;
            border: none;
            cursor: pointer;
            display: block;
            width: 100%;
        }

        .download-btn:hover {
            background-color: var(--accent-hover);
        }
        
        .download-btn.loading {
            background-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* LOADING SPINNER */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- Header matching top left of the app -->
    <div class="header">
        <div class="logo-container">
            <div class="logo-icon"></div>
            <div class="title">
                <h1>oozy's Fortnite Porter</h1>
                <p>FORTNITE ASSET TOOL</p>
            </div>
        </div>
        <div class="version-pill" id="header-version">fetching...</div>
    </div>

    <!-- Main Content Panel -->
    <div class="panel">
        <div class="panel-header">
            <h2>Latest Release Notes</h2>
            <div class="version-pill" id="panel-version">v --</div>
        </div>
        
        <div class="panel-content">
            <!-- Release notes will populate here -->
            <div class="release-notes" id="release-notes">
                <div class="loader-container">
                    <p>Loading latest release data from GitHub...</p>
                </div>
            </div>

            <!-- The Big Download Button -->
            <a href="#" id="download-btn" class="download-btn loading">Please wait...</a>
        </div>
    </div>

    <script>
        // ==========================================
        // USER SETTINGS: CHANGE THESE TO YOUR REPO!
        // ==========================================
        const GITHUB_USERNAME = 'YOUR_GITHUB_USERNAME'; // e.g. 'oozy'
        const GITHUB_REPO = 'YOUR_GITHUB_REPO_NAME';    // e.g. 'Fortnite-Porter'
        // ==========================================

        async function getLatestRelease() {
            const btn = document.getElementById('download-btn');
            const notes = document.getElementById('release-notes');
            const headerVer = document.getElementById('header-version');
            const panelVer = document.getElementById('panel-version');

            try {
                // Fetch release data from GitHub API
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/releases/latest`);
                
                if (!response.ok) {
                    throw new Error('Could not fetch releases. Check your username/repo spelling.');
                }

                const data = await response.json();

                // 1. Update Version Badges
                headerVer.textContent = data.tag_name;
                panelVer.textContent = data.tag_name;

                // 2. Parse and insert Release Notes using marked.js
                if (data.body) {
                    notes.innerHTML = marked.parse(data.body);
                } else {
                    notes.innerHTML = '<p>No release notes provided for this version.</p>';
                }

                // 3. Find the download URL (.exe or .zip)
                if (data.assets && data.assets.length > 0) {
                    // Try to find an .exe file, otherwise just default to the first uploaded asset
                    const exeAsset = data.assets.find(asset => asset.name.endsWith('.exe'));
                    const targetAsset = exeAsset || data.assets[0];

                    btn.href = targetAsset.browser_download_url;
                    btn.textContent = `Download ${targetAsset.name}`;
                    btn.classList.remove('loading');
                } else {
                    // Fallback if you created a release but didn't upload a file
                    btn.href = data.html_url;
                    btn.textContent = "View Release on GitHub (No files attached)";
                    btn.classList.remove('loading');
                }

            } catch (error) {
                console.error(error);
                notes.innerHTML = `<p style="color: #ff5555;">Error: ${error.message}</p><p>Make sure you have created at least one public release on GitHub.</p>`;
                btn.textContent = "Go to GitHub Repository";
                btn.href = `https://github.com/${GITHUB_USERNAME}/${GITHUB_REPO}`;
                headerVer.textContent = "error";
                panelVer.textContent = "error";
            }
        }

        // Run the function when the page loads
        getLatestRelease();
    </script>
</body>
</html>
