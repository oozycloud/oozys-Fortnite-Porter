<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oozy's Fortnite Porter | Download</title>
    <!-- We use marked.js to convert your GitHub Markdown release notes into beautiful HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            /* Exact theme colors from the app design */
            --bg-base: #0f0f11;
            --bg-panel: #151517;
            --bg-panel-light: #1c1c1e;
            --accent-orange: #fe8549;
            --accent-glow: rgba(254, 133, 73, 0.4);
            --accent-hover: #ff9c6b;
            --text-main: #f0f0f0;
            --text-muted: #9a9a9d;
            --border-color: #2a2a2c;
            --pill-bg: #35231c;
            --pill-text: #fe8549;
            --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* -----------------------------------------------------------
           GLOBAL STYLES & LAYOUT
           ----------------------------------------------------------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            /* Subtle background grid pattern with light ambient orange glow */
            background-image: 
                radial-gradient(circle at top right, rgba(254, 133, 73, 0.05) 0%, transparent 40%),
                radial-gradient(circle at center bottom, rgba(254, 133, 73, 0.02) 0%, transparent 30%);
            overflow-x: hidden;
        }

        /* Container to keep everything sharp and centered */
        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            /* Animation: Fade in whole page on load */
            opacity: 0;
            animation: fadeInPage 1s var(--ease-in-out) forwards;
        }

        /* -----------------------------------------------------------
           HEADER MATCHING THE APP
           ----------------------------------------------------------- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* The broken circle CSS icon with a constant subtle spin */
        .logo-icon {
            width: 32px;
            height: 32px;
            background-color: transparent;
            border: 4px solid var(--accent-orange);
            border-radius: 50%;
            border-bottom-color: transparent; 
            transform: rotate(45deg);
            box-shadow: 0 0 10px var(--accent-glow);
            animation: slowRotate 8s linear infinite;
        }

        .title h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .title p {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* Recreating the "beta 0.0.1" look */
        .version-pill {
            background-color: var(--pill-bg);
            color: var(--pill-text);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(254, 133, 73, 0.2);
            position: relative;
            transition: box-shadow 0.3s ease;
        }
        
        /* Subtle glow hover effect on pill */
        .version-pill:hover {
            box-shadow: 0 0 10px rgba(254, 133, 73, 0.3);
        }

        /* -----------------------------------------------------------
           MAIN RELEASE PANEL
           ----------------------------------------------------------- */
        .panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* Deep, dark box shadow for panel definition */
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
            /* Animation: Slide in from bottom */
            opacity: 0;
            transform: translateY(20px);
            animation: slideInUp 0.8s var(--ease-in-out) 0.3s forwards;
        }

        .panel-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-panel-light);
        }

        .panel-header h2 {
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .panel-content {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* -----------------------------------------------------------
           RELEASE NOTES (MARKDOWN STYLING)
           ----------------------------------------------------------- */
        .release-notes {
            color: var(--text-main);
            font-size: 14px;
            line-height: 1.6;
            background-color: var(--bg-base);
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            max-height: 400px;
            overflow-y: auto;
            position: relative;
        }
        
        /* Specific markdown styles to match theme */
        .release-notes h1, .release-notes h2, .release-notes h3 {
            color: var(--accent-orange);
            margin-bottom: 10px;
            margin-top: 15px;
            font-size: 16px;
            text-shadow: 0 0 5px var(--accent-glow);
        }
        
        .release-notes h1:first-child, .release-notes h2:first-child { margin-top: 0; }
        .release-notes ul { margin-left: 20px; margin-bottom: 15px; color: var(--text-muted); }
        .release-notes li { margin-bottom: 5px; }
        .release-notes a { color: var(--accent-orange); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.2s ease; }
        .release-notes a:hover { border-color: var(--accent-orange); }
        .release-notes code { background: #000; padding: 2px 6px; border-radius: 4px; font-family: monospace; }

        /* Fancy scrollbar styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; transition: background 0.3s ease; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        /* -----------------------------------------------------------
           DOWNLOAD BUTTON MATCHING "SCAN FORTNITE FILES"
           ----------------------------------------------------------- */
        .download-btn {
            background-color: var(--accent-orange);
            color: #000000;
            text-decoration: none;
            padding: 16px 24px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            border: none;
            cursor: pointer;
            display: block;
            width: 100%;
            position: relative;
            /* Animation for normal state and pulse when loading */
            transition: 
                background-color 0.2s ease, 
                box-shadow 0.3s ease, 
                transform 0.1s ease;
            box-shadow: 0 4px 10px rgba(254, 133, 73, 0.2);
            overflow: hidden;
        }

        /* Subtle shine animation overlay */
        .download-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.4) 50%, transparent 60%);
            transform: rotate(20deg);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* Hover: Scale up, increase brightness, intensify glow, show shine */
        .download-btn:not(.loading):hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }
        .download-btn:not(.loading):hover::after {
            animation: shine 1.5s infinite;
            opacity: 1;
        }

        /* Click/Active state animation */
        .download-btn:not(.loading):active {
            transform: translateY(1px);
            box-shadow: 0 2px 5px var(--accent-glow);
            background-color: var(--accent-orange);
        }
        
        /* Disabled/Loading State */
        .download-btn.loading {
            background-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
            animation: pulseBtnLoading 1.5s ease-in-out infinite;
        }

        /* -----------------------------------------------------------
           LOADING & LOGO KEYFRAMES
           ----------------------------------------------------------- */
        @keyframes fadeInPage { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        @keyframes slowRotate { from { transform: rotate(45deg); } to { transform: rotate(405deg); } }
        
        /* Pulse effects for loading data/button */
        @keyframes pulseNotesLoading { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.9; } }
        @keyframes pulseBtnLoading { 0%, 100% { background-color: var(--border-color); } 50% { background-color: #3a3a3d; } }
        
        /* Shine effect across the button */
        @keyframes shine { from { left: -150%; } to { left: 150%; } }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: var(--text-muted);
            animation: pulseNotesLoading 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header: Matching top left of the app -->
        <div class="header">
            <div class="logo-container">
                <div class="logo-icon"></div>
                <div class="title">
                    <h1>oozy's Fortnite Porter</h1>
                    <p>FORTNITE ASSET TOOL</p>
                </div>
            </div>
            <!-- Dynamic Version Badge (Updated by JS) -->
            <div class="version-pill" id="header-version">fetching...</div>
        </div>

        <!-- Main Release Panel -->
        <div class="panel">
            <div class="panel-header">
                <h2>Latest Release Notes</h2>
                <div class="version-pill" id="panel-version">v --</div>
            </div>
            
            <div class="panel-content">
                <!-- Release Notes Area: Populated automatically -->
                <div class="release-notes" id="release-notes">
                    <div class="loader-container">
                        <p>Loading latest release data from GitHub...</p>
                    </div>
                </div>

                <!-- The Primary Download Button: Pulses while loading -->
                <a href="#" id="download-btn" class="download-btn loading">Please wait...</a>
            </div>
        </div>
    </div>

    <!-- -----------------------------------------------------------
         JAVASCRIPT: The GitHub API Auto-Updater
         ----------------------------------------------------------- -->
    <script>
        // ==========================================
        // USER SETTINGS: ALREADY PRE-CONFIGURED!
        // ==========================================
        const GITHUB_USERNAME = 'oozycloud'; 
        const GITHUB_REPO = 'oozys-Fortnite-Porter';    
        // ==========================================

        async function getLatestRelease() {
            const btn = document.getElementById('download-btn');
            const notes = document.getElementById('release-notes');
            const headerVer = document.getElementById('header-version');
            const panelVer = document.getElementById('panel-version');

            try {
                // Fetch release data from the official GitHub API
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/releases/latest`);
                
                if (!response.ok) {
                    throw new Error('Could not fetch releases. It seems the API or your repo info is incorrect.');
                }

                const data = await response.json();

                // 1. Update Version Badges
                headerVer.textContent = data.tag_name;
                panelVer.textContent = data.tag_name;

                // 2. Parse and insert Release Notes using marked.js
                // Add a slight delay for aesthetic flow
                setTimeout(() => {
                    if (data.body) {
                        // Markded.js parses the raw markdown from GitHub into HTML
                        notes.innerHTML = marked.parse(data.body);
                    } else {
                        notes.innerHTML = '<p>No detailed release notes provided for this version.</p>';
                    }
                    // Stop notes loading pulse
                    notes.querySelector('.loader-container')?.classList.remove('loader-container');
                }, 400);

                // 3. Find the official download URL (looks for .exe first, then defaults to first asset)
                if (data.assets && data.assets.length > 0) {
                    // Filter to find the principal executable if possible (.exe)
                    const exeAsset = data.assets.find(asset => asset.name.endsWith('.exe'));
                    const targetAsset = exeAsset || data.assets[0]; // fallback to any available file

                    // Update the button link and text
                    btn.href = targetAsset.browser_download_url;
                    btn.textContent = `Download ${targetAsset.name}`;
                    
                    // Unlock the button: Remove loading animation, trigger hover/click styles
                    btn.classList.remove('loading');
                } else {
                    // Fallback if you created a release but forgot to upload a binary file
                    btn.href = data.html_url;
                    btn.textContent = "View Release on GitHub (No attached files)";
                    btn.classList.remove('loading');
                    btn.style.backgroundColor = "#555"; // Make it look less active
                }

            } catch (error) {
                // Gentle Error Handling: Log the error and guide the user
                console.error("[GitHub Pages Updater] Error:", error);
                
                headerVer.textContent = "error";
                panelVer.textContent = "error";
                notes.innerHTML = `<p style="color: #ff5555; font-weight: bold;">Error fetching release data.</p><p style="color:var(--text-muted); margin-top: 10px;">${error.message}</p><p>Make sure you have created at least one public release on GitHub.</p>`;
                
                // Set the button to just link back to the main repository as a backup
                btn.textContent = "View GitHub Repository";
                btn.href = `https://github.com/${GITHUB_USERNAME}/${GITHUB_REPO}`;
                btn.classList.remove('loading');
            }
        }

        // Run the main updater function when the DOM is ready
        document.addEventListener('DOMContentLoaded', getLatestRelease);
    </script>
</body>
</html>
